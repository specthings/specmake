- role: spec-refinement
  spec-key: pkg-type
  spec-value: repository-filter
  uid: pkg-root
spec-description: |
  A workspace repository with an enabled repository filter clones the commit
  with its complete history.  The filter rewrites the commits which follow
  the baseline up to the commit.  A rule reaches a file of the baseline only
  in the filtered commits which change the file.  The export logs a warning
  with the files of the baseline which the rules drop.  It logs a warning
  with the count of the files of the baseline which a content rule selects,
  for each such content rule.  The filter drops a commit which becomes empty.
  The clone depth applies to the filtered history.  The buildspace item
  records the filtered commit.

  A content rule changes a file only under the paths which its globs select.
  A commit which renames or copies a changed file to a path which no glob of
  the rule selects delivers the original content under that path.  The
  commits fetched through ``origin-fetch`` of the repository do not pass the
  filter.

  The specification export of an archive does not export the item.
spec-example: null
spec-info:
  dict:
    attributes:
      baseline:
        description: |
          It shall be the commit of the source repository which the filter
          leaves unchanged together with its ancestors.  The origin commit of
          the repository shall be the baseline or one of its ancestors.
        spec-type: str
      content-rules:
        description: |
          It shall be the list of content rules.
        spec-type: pkg-repository-filter-content-rule-list
      path-rules:
        description: |
          It shall be the list of path rules.
        spec-type: pkg-repository-filter-path-rule-list
    description: |
      This set of attributes specifies the filter of the history of a
      workspace repository.  The item links to the workspace repository with
      the ``repository-filter`` role.  The filter of a workspace repository
      uses the rules of all its enabled repository filters.  These shall have
      the same baseline.
    mandatory-attributes:
    - baseline
    - path-rules
spec-name: Repository Filter Item Type
spec-type: pkg-repository-filter
type: spec
