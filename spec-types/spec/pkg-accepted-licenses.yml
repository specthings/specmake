spec-info:
  list:
    description: |
      It shall be the licenses which a work accepts for a part whose license
      expression permits not the license of the work.  The work lists the
      copyrights of such a part separately.  A part which permits neither the
      license of the work nor a license of this list is an error.  The check
      reads the license expression and knows no compatibility of licenses.
      For example, a BSD-2-Clause part of a GPL-2.0-only work needs an entry
      in this list, and the work lists its copyrights separately.
    spec-type: spdx-license-identifier
spec-name: Accepted Licenses
spec-type: pkg-accepted-licenses
