links:
- role: spec-member
  uid: root
- role: spec-refinement
  spec-key: role
  spec-value: spamr-inspection-group
  uid: link
spec-description: null
spec-example: null
spec-info:
  dict:
    attributes:
      analysis:
        description: |
          It shall be the name of the analysis which the group covers with
          its article, for example *the Clang Static Analyzer*.  The annex of
          the findings presents the findings of the group in a section with
          the title *Findings of* followed by this name.
        spec-type: str
    description: |
      It defines the SPAMR inspection group role of links.  The link target
      shall be an inspection group.  The software product assurance milestone
      report presents the findings of the analyses which the group covers, each
      with its disposition, in the order of the links.
    mandatory-attributes: all
spec-name: SPAMR Inspection Group Link Role
spec-type: pkg-spamr-inspection-group-role
type: spec
