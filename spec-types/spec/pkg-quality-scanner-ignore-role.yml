spec-info:
  dict:
    attributes: {}
    description: |
      It defines the quality scanner ignore role of links.  The link source
      shall be a quality scanner.  The scanner does not scan the link target.
      If the link target is an inspection group, then the scanner does not
      scan its members either.  An inspection of a marker names the marker in
      its scopes.  The link keeps the scanner from finding it there again.
    mandatory-attributes: all
spec-name: Quality Scanner Ignore Link Role
spec-type: pkg-quality-scanner-ignore-role
type: spec
