spec-info:
  list:
    description: |
      It shall be the relicensing rules of a work in the order of a chain.
      The license which a rule produces is the input of the next rule.  A
      rule which does not apply passes the license unchanged to the next
      rule.  The work checks its own license first, then the chain, then
      its accepted licenses.
    spec-type: pkg-relicensing-rule
spec-name: Relicensing Rule List
spec-type: pkg-relicensing-rule-list
type: spec
