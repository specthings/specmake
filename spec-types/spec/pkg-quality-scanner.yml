- role: spec-refinement
  spec-key: directory-state-type
  spec-value: quality-scanner
  uid: pkg-directory-state
spec-description: |
  The quality scanner scans the string values of the items of the item cache
  and the ``.rst`` and ``.md`` files of the documents for the open item
  markers "to be defined" and "to be confirmed" in their three letter form.
  The input links named ``document`` provide the documents.  The scanner skips
  its own item, since its suppressions name the markers.  The scanner writes
  each occurrence as a result to the SARIF file of the directory state.  An
  item result names the item attribute as a logical location.  A document
  result names the line and column of the file.  The ``artifacts`` of the
  SARIF run list each scanned item and document file.
spec-example: null
spec-info:
  dict:
    attributes:
      suppressions:
        description: |
          It shall be the list of suppressions for occurrences which are no
          open item.
        spec-type: pkg-quality-scanner-suppression-list
    description: |
      This set of attributes specifies a quality scanner.
    mandatory-attributes: all
spec-name: Quality Scanner Item Type
spec-type: pkg-quality-scanner
type: spec
