spec-info:
  dict:
    attributes:
      enabled-set:
        description: |
          It shall be the enabled set of the component.
        spec-type: list-str
      enabled-set-actions:
        description: |
          It shall be the list of enabled set actions.
        spec-type: enabled-set-action-list
      enabled-set-feedback-mapping:
        description: |
          It shall be the mapping of patterns to replacements.  Each key is a
          Python regular expression.  It matches an enabled set key of the
          component in full.  The tool expands the match in the replacement
          and converts the result to lower case.  The result is an enabled set
          key of the upper-level component.  Several patterns may match one
          key.
        spec-type: str-to-str
