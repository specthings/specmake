spec-info:
  dict:
    attributes:
      component-type:
        description: |
          It shall be the component type.
        spec-type: name
      enabled-set:
        description: |
          It shall be the enabled set of the component.
        spec-type: list-str
      accepted-licenses:
        description: |
          It shall be the licenses which a work of the component accepts for a
          part whose license expression permits not the license of the work.
          A component which states none takes the accepted licenses of its
          parent component.  A root component which states none accepts no
          license.
        spec-type: pkg-accepted-licenses
      license:
        description: |
          It shall be the license of a work of the component.  A component
          which states none takes the license of its parent component.
        spec-type: spdx-license-identifier
    description: |
      This set of attributes specifies a package component.
    mandatory-attributes:
    - component-type
    - enabled-set
