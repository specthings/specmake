  spec-key: pkg-type
  spec-value: inspection
  uid: pkg-root
spec-description: null
spec-example: null
spec-info:
  dict:
    attributes:
      date:
        description: |
          If the value is present, then it shall be the date of the inspection,
          otherwise the inspection is not judged.
        spec-type: pkg-inspection-date
      rationale:
        description: |
          If the value is present, then it shall state why the inspectors
          reached the verdict.
        spec-type: optional-str
      subject:
        description: |
          If the value is present, then it shall state the inspected object,
          the criteria and the sample of the inspection.
        spec-type: optional-str
      verdict:
        description: |
          If the value is present, then it shall be the verdict of the
          inspection, otherwise the inspection is not judged.
        spec-type: pkg-inspection-verdict
    description: |
      This set of attributes specifies one inspection of one or more artefacts.
      An inspection item is one inspection round.  A repeated inspection is a
      new item which supersedes this one.  An inspection without inspector
      links is not judged.  The inspection applies the methods which it and
      its groups link.  An inspection without a method is not judged.
    mandatory-attributes: all
spec-name: Inspection Item Type
spec-type: pkg-inspection
type: spec
