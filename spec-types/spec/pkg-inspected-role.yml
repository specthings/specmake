spec-info:
  dict:
    attributes:
      scopes:
        description: |
          It shall be the list of inspected scopes of the link target.
        spec-type: pkg-inspection-scope-list
    description: |
      It defines the inspected role of links.  The link target shall be the
      inspected artefact.  For file scopes it shall be a directory state, for
      item scopes it shall be the inspected item itself, and for finding scopes
      it shall be a directory state with SARIF files.
    mandatory-attributes: all
