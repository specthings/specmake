spec-info:
  dict:
    attributes:
      enabled-by:
        description: |
          It shall define the condition under which the rule is enabled.
        spec-type: enabled-by
      rule:
        description: |
          It shall be the kind of the content rule.
        spec-type: name
    description: |
      This set of attributes specifies a content rule of a repository filter.
      The enabled content rules of the enabled repository filter items apply in
      the order of the items and of the rules.  A content rule applies to each kept
      file which no replacement names.  The filter transforms each distinct pair of
      a path and a file content once.
    mandatory-attributes: all
