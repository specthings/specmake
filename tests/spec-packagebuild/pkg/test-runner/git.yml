default-timeout-in-seconds: 90.0
description: |
  Run the tests using an agent through a Git bridge.
do-not-run: []
enabled-by: test-runner-git
links:
- role: target
  uid: /target/alpha
max-retry-count-per-executable: 3
min-timeout-in-seconds: 10.0
name: EB Test Runner for target ${.:/target-name}
nm: ${.:/component/deployment-directory}/bin/${.:/component/arch}-rtems${.:/component/rtems-version}-nm
params: {}
pkg-type: test-runner
remote:
- enabled-by: foobar
  value: /bleifus.git
- enabled-by: true
  value: /iris.git
reset:
- enabled-by: true
  value: bsp_reset
strip: ${.:/component/deployment-directory}/bin/${.:/component/arch}-rtems${.:/component/rtems-version}-strip
target:
- enabled-by:
    not: no-target
  value: the/target
test-runner-type: git
timeout-scaler: 2.0
type: pkg
wait-timeout-in-seconds: 60.0
